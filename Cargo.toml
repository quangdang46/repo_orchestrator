[workspace]
members = [
    "crates/ro",
    "crates/ro-core",
    "crates/ro-config",
    "crates/ro-state",
    "crates/ro-git",
    "crates/ro-github",
    "crates/ro-jobs",
    "crates/ro-sync",
    "crates/ro-sweep",
]
resolver = "3"
default-members = ["crates/ro"]

[workspace.package]
version = "0.2.0"
authors = ["quangdang46 <quangdang46@github.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quangdang46/repo_orchestrator"
keywords = ["repo", "github", "orchestration", "cli", "devops"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Core crates (local)
ro-core        = { path = "crates/ro-core" }
ro-config      = { path = "crates/ro-config" }
ro-state       = { path = "crates/ro-state" }
ro-git         = { path = "crates/ro-git" }
ro-github      = { path = "crates/ro-github" }
ro-jobs        = { path = "crates/ro-jobs" }
ro-sync        = { path = "crates/ro-sync" }
ro-sweep       = { path = "crates/ro-sweep" }

# External — shared across multiple crates
anyhow          = "1.0"
thiserror       = "2.0"
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
tokio           = { version = "1.44", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap            = { version = "4.5", features = ["derive", "env", "string"] }
rusqlite        = { version = "0.34", features = ["bundled", "modern_sqlite"] }
gix             = { version = "0.71" }
octocrab        = { version = "0.44", features = ["retry"] }
fs4             = "0.13"
reqwest         = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex           = "1.11"
indexmap        = "2.7"
toml            = "0.8"
dirs            = "5.0"
time             = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
uuid             = { version = "1.16", features = ["v4", "serde"] }
chrono          = { version = "0.4", features = ["serde"] }
humantime        = "2.1"
similar         = "2.7"
tempfile         = "3.20"
wiremock        = "0.6"
assert_cmd      = "2.0"
predicates       = "3.1"
globset         = "0.4"
serde_yaml      = "0.9"

# cargo-dist release configuration.
# Drives the `Release` GitHub Actions workflow (see `.github/workflows/release.yml`).
# Update with `dist init` if cargo-dist is upgraded.
[workspace.metadata.dist]
# Pin the dist CLI version that workflows install. Keep in sync with
# `DIST_VERSION` env in `.github/workflows/release.yml`.
cargo-dist-version = "0.28.0"
# We drive CI ourselves; let dist still know it targets GitHub Actions.
ci = ["github"]
# Installer flavors generated alongside the archives.
installers = ["shell", "powershell"]
# Release targets — must match the matrix in the release workflow.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Archive layout per platform: tarballs on Unix, zip on Windows.
unix-archive = ".tar.xz"
windows-archive = ".zip"
# SHA256 checksums for every artifact.
checksum = "sha256"
# Auto-generate release notes from the changelog / commits.
pr-run-mode = "plan"
# Publish only the `ro` binary crate; ignore xtask + library crates.
precise-builds = true
allow-dirty = ["ci"]

# Release profile — matches cargo-dist conventions.
[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
codegen-units = 16
panic = "abort"
debug = false

[profile.dev]
opt-level = 0
debug = true
lto = false
incremental = true
codegen-units = 256
panic = "unwind"

# cargo-dist
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"
opt-level = 3
codegen-units = 16
panic = "abort"
debug = false
