name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `--all-features` enables ro-core's default-on `keychain` feature,
      # which reaches `libdbus-sys` and links against the system `dbus-1`.
      # Without the headers the build script panics with a bare "explicit
      # panic" naming no crate, so it reads as a broken build rather than a
      # missing system package.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      # `keyring` (ro-core's default-on `keychain` feature) reaches
      # `dbus-secret-service` -> `libdbus-sys`, whose build script links
      # against the system `dbus-1`. Without the headers it panics with a
      # bare "explicit panic" and no crate name, so the failure reads as a
      # broken build rather than a missing dependency.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Windows post-save sometimes fails with file-lock errors, marking
          # the whole job as failed even though tests passed.  Only save the
          # cache from the build matrix (which also uses rust-cache).
          save-if: ${{ runner.os != 'Windows' }}
      - run: cargo test --all-features --verbose --workspace
      - run: cargo test --doc --workspace

  build:
    name: Build (${{ matrix.target }})
    needs: [fmt, clippy, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      # musl static linking needs the musl C toolchain on Linux.
      - name: Install musl tooling
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      # ARM cross-compilation: install cross-compiler on x86_64 Ubuntu.
      # On native ARM runners (ubuntu-24.04-arm), the default linker works.
      # libz-ng-sys (via cmake) also needs the C++ cross-compiler for CMake's
      # compiler ABI detection, so install g++ as well.
      - name: Install ARM cross-compiler
        if: contains(matrix.target, 'aarch64') && runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build
        env:
          # Tell the cc / cmake crates to use the ARM cross-compilers when
          # building C/C++ dependencies (e.g. libz-ng-sys) for the aarch64
          # Linux target.  Only set on Linux x64 → aarch64 cross builds.
          CC_aarch64_unknown_linux_gnu: ${{ contains(matrix.target, 'aarch64') && runner.os == 'Linux' && runner.arch == 'X64' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ contains(matrix.target, 'aarch64') && runner.os == 'Linux' && runner.arch == 'X64' && 'aarch64-linux-gnu-g++' || '' }}
          AR_aarch64_unknown_linux_gnu: ${{ contains(matrix.target, 'aarch64') && runner.os == 'Linux' && runner.arch == 'X64' && 'aarch64-linux-gnu-ar' || '' }}
        run: cargo build --release --workspace --target ${{ matrix.target }}

  # The installers, actually run.
  #
  # `install.sh` and `install.ps1` are the two files a new user meets first,
  # and neither had ever been executed: `install.sh` was verified by hand on
  # one machine, and `install.ps1` had never been run at all. An installer
  # that has never run is a script whose correctness is a claim, and the
  # failures it produces land on the user rather than on us.
  #
  # These steps install from the **published release** — the same download
  # `curl -fsSL ... | bash` performs — and then run the binary that landed.
  # That makes "the installer works" and "the released binary works" a single
  # check rather than two claims that can drift apart.
  install:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run install.sh
        if: runner.os != 'Windows'
        env:
          # Into the workspace, so the step is hermetic and leaves nothing
          # behind on the runner image.
          RO_INSTALL_DIR: ${{ github.workspace }}/robin
          # The job re-runs on a fresh runner, but a cache hit would make
          # the "already exists" refusal fire for the wrong reason.
          RO_FORCE: "1"
        run: bash install.sh

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RO_PREFIX: ${{ github.workspace }}\robin
        run: ./install.ps1

      # The install is only evidence if the binary it placed is the one that
      # runs, and the version it reports is the one the release named.
      - name: The installed binary runs
        shell: bash
        run: |
          "${{ github.workspace }}/robin/ro" --version
          "${{ github.workspace }}/robin/ro" --help > /dev/null

      - name: The installed binary runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ github.workspace }}\robin\ro.exe" --version
          & "${{ github.workspace }}\robin\ro.exe" --help | Out-Null

      # A binary that installs and prints a version but cannot do the job is
      # not installed, it is merely present. `ro doctor` is the closest thing
      # to a self-check ro has, and it exercises config, state and the git
      # backend for real.
      - name: The installed binary does the job
        shell: bash
        run: |
          export RO_CONFIG_DIR="${{ github.workspace }}/.ro-check"
          "${{ github.workspace }}/robin/ro" init
          "${{ github.workspace }}/robin/ro" --version
