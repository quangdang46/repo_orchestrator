name: Release

# Tag-driven release pipeline powered by `cargo-dist` (the `dist` CLI).
# Triggered by pushing a SemVer-style tag, e.g. `v0.1.0`, `v1.2.3-rc.1`.
#
# Pipeline:
#   plan    -> resolves the dist manifest for the tag.
#   build   -> matrix build of release artifacts on each target host.
#   release -> aggregates artifacts + SHA256 checksums into a GitHub Release.

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin the dist CLI to a known-good version. Bump intentionally.
  DIST_VERSION: 0.28.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # A release may only ship a commit CI has signed off on.
  #
  # This workflow is tag-triggered, which means it used to run on whatever
  # commit the tag happened to point at — including one whose CI was still
  # red. That is not hypothetical: v0.4.0 was tagged onto a commit where
  # Format, Clippy and all three Test jobs were failing, and every one of
  # those jobs here then built an artifact from it. A tag is a claim about a
  # commit, and nothing was checking the claim.
  #
  # So the first job is the check, and everything else waits on it. It reads
  # the CI workflow's own conclusion for the tagged SHA rather than
  # re-running the suite, so the gate costs one API call and cannot disagree
  # with the run a developer already watched go green.
  gate:
    name: Gate on CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: The CI workflow must have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          run_json=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1")

          conclusion=$(jq -r '.workflow_runs[0].conclusion // "none"' <<<"${run_json}")
          html_url=$(jq -r '.workflow_runs[0].html_url // "(no run)"' <<<"${run_json}")

          if [ "${conclusion}" != "success" ]; then
            echo "::error::Refusing to release ${TAG}." \
              "The CI workflow's latest run on ${SHA} concluded '${conclusion}', not 'success'." \
              "See ${html_url}. Wait for it to go green, or fix what is red, then re-tag."
            exit 1
          fi

          echo "CI passed on ${SHA} (${html_url}); releasing ${TAG}."

  plan:
    name: Plan
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: dist plan
        run: dist plan --tag="${GITHUB_REF_NAME}" --output-format=json > dist-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-manifest
          path: dist-manifest.json

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: dist-${{ matrix.target }}

      # musl static linking needs the musl C toolchain on Linux.
      - name: Install musl tooling
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://github.com/axodotdev/cargo-dist/releases/download/v$env:DIST_VERSION/cargo-dist-installer.ps1" | iex

      # No `libdbus-1-dev` step here, and that is deliberate rather than an
      # oversight. The `keychain` feature reaches `dbus-secret-service` ->
      # `libdbus-sys`, whose build script runs `pkg-config` for `dbus-1`; the
      # Linux targets in this matrix are all musl, and a statically linked
      # musl binary cannot link a glibc libdbus at all — a missing libc, not a
      # missing package, so no `apt-get` line fixes it.
      #
      # `dist` cannot set features per target (axodotdev/cargo-dist#772 is an
      # open request), so the feature is turned off for the release build as
      # a whole via `default-features = false` in Cargo.toml's
      # `[workspace.metadata.dist]`. The consequence is stated there, and it
      # is the right trade: a released binary is a static one, and a static
      # binary is what gets installed on headless machines, where a keyring
      # is not running anyway. `env:VAR_NAME` remains the credential path.
      - name: Build artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: dist build --tag="${GITHUB_REF_NAME}" --target=${{ matrix.target }} --artifacts=local

      - name: Build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export LIBZ_SYS_DISABLE_NATIVE=1
          dist build --tag="${GITHUB_REF_NAME}" --target=${{ matrix.target }} --artifacts=local

      - name: Generate SHA256 checksums
        shell: bash
        working-directory: target/distrib
        run: |
          shopt -s nullglob
          for f in *.tar.gz *.tar.xz *.tar.zst *.zip *.exe *.msi *.deb *.rpm; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.tar.xz
            target/distrib/*.tar.zst
            target/distrib/*.zip
            target/distrib/*.sha256
          if-no-files-found: error

  build-global:
    name: Build global installers
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: dist-global
      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      # `dist build --artifacts=global` emits the cargo-dist universal installer
      # scripts (ro-installer.sh / ro-installer.ps1) plus an updated
      # dist-manifest.json. The installers reference release-asset URLs derived
      # from the tag, so they don't need the matrix archives to be physically
      # present here.
      - name: Build global artifacts (installers + manifest)
        run: dist build --tag="${GITHUB_REF_NAME}" --artifacts=global

      - name: Generate SHA256 for installers
        shell: bash
        working-directory: target/distrib
        run: |
          shopt -s nullglob
          for f in *-installer.sh *-installer.ps1; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          echo "--- target/distrib ---"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: dist-global
          path: |
            target/distrib/*-installer.sh
            target/distrib/*-installer.ps1
            target/distrib/*.sha256
            target/distrib/dist-manifest.json
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [plan, build, build-global]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Download each artifact individually to avoid pattern matching issues
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-unknown-linux-musl
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: dist-aarch64-unknown-linux-musl
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-apple-darwin
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: dist-aarch64-apple-darwin
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-pc-windows-msvc
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: dist-global
          path: artifacts
      - name: List artifacts
        run: |
          echo "=== artifacts listing ==="
          find artifacts -type f | sort
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          find artifacts -type f | sort
          echo "---"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag \
            $(find artifacts -type f | sort)
