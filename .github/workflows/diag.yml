name: Windows diagnostic
on:
  push:
    branches: ["worktree-diagnostic"]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove the shim records argv, on Windows
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "s"
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          $log = Join-Path $d "argv.log"
          $body = "@echo off`r`n<nul set /p=`"%*`" >> `"$log`"`r`n<nul set /p=`"--RO-SEP--`" >> `"$log`"`r`nexit /b 0"
          Set-Content -Path (Join-Path $d "claude.cmd") -Value $body
          & (Join-Path $d "claude.cmd") -p "hello world"
          Write-Host "LOG=[$(if (Test-Path $log) { [System.IO.File]::ReadAllText($log) } else { '<none>' })]"
