name: Windows diagnostic
on:
  push:
    branches: ["worktree-diagnostic"]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try the three ways of appending argv in a .cmd
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "t"
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          $log = Join-Path $d "log.txt"

          # A: nul set /p
          Set-Content -Path (Join-Path $d "a.cmd") -Value "@echo off`r`n<nul set /p=`"%*`" >> `"$log`"`r`nexit /b 0"
          & (Join-Path $d "a.cmd") -p hello
          Write-Host "A nul-set  => [$(if (Test-Path $log) { (Get-Content $log -Raw) } else { '<no file>' })]"

          Remove-Item $log -ErrorAction SilentlyContinue
          # B: echo with redirection
          Set-Content -Path (Join-Path $d "b.cmd") -Value "@echo off`r`necho %*>> `"$log`"`r`nexit /b 0"
          & (Join-Path $d "b.cmd") -p hello
          Write-Host "B echo    => [$(if (Test-Path $log) { (Get-Content $log -Raw) } else { '<no file>' })]"

          Remove-Item $log -ErrorAction SilentlyContinue
          # C: plain echo, no redirect quoting
          Set-Content -Path (Join-Path $d "c.cmd") -Value "@echo off`r`necho %* > `"$log`"`r`nexit /b 0"
          & (Join-Path $d "c.cmd") -p hello
          Write-Host "C echo2   => [$(if (Test-Path $log) { (Get-Content $log -Raw) } else { '<no file>' })]"
