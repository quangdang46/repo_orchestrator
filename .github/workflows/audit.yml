name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      # The EmbarkStudios docker action defaults to a musl host and trips
      # over rust-toolchain.toml (stable-x86_64-unknown-linux-musl is never
      # installed in the container). cargo-deny is a standalone binary —
      # install it directly instead.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # Ignored advisories are tracked in deny.toml [advisories.ignore].
      # There are none: an ignore naming nothing in the graph is at best
      # noise and at worst a hard failure, so each one is removed the day
      # the dependency it named leaves the graph.
      - run: cargo audit --deny warnings
