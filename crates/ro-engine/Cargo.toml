[package]
name = "ro-engine"
description = "The engine trait, the three built-in engines, and the context that bounds them"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The auth vocabulary and the failure taxonomy both live in ro-core, which
# depends on no workspace crate. Defining either here would be the second
# definition in the tree, and ro-core exists precisely so there is one.
ro-config.workspace = true
ro-core.workspace = true

# No clap and no tokio. A library that pulls in an argument parser to read
# three strings cannot be used from a plain unit test, and an async runtime
# buys nothing for a subprocess with a deadline.
#
# The subprocess work goes through ro-git, which already owns the env
# hardening block, the timeout, and the child-tree kill.
ro-git.workspace = true

# The Claude stream-json parser. A hand-rolled line scan would be a second
# format definition that drifts from the one the real output uses.
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# A Windows Job Object, so a killed engine takes its **descendants** with it.
#
# `taskkill /T` walks the live process list looking for children of a PID, so
# it can only ever reach a tree whose root is still running. By the time the
# deadline fires the direct child has usually been reaped, and a descendant it
# started is then unreachable: it keeps the inherited pipe handles open, and
# the run blocks on a join that can never return. A Job Object is the only
# Windows construct that ties the whole tree to a handle this process holds.
#
# The four features are exactly the four API families that needs, and nothing
# pulls `Win32` as a whole: `Foundation` for `HANDLE` and `CloseHandle`,
# `JobObjects` for the job itself, `Threading` for the process handle, and
# `Security` because `CreateJobObjectW` takes a `SECURITY_ATTRIBUTES` even
# when it is passed null.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The trait references FailureClass, so a test that builds a Failed outcome
# needs the enum itself.
ro-config.workspace = true
ro-core.workspace = true
tempfile.workspace = true
ro-testkit = { path = "../ro-testkit" }
