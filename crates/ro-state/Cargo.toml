[package]
name = "ro-state"
description = "SQLite schema, migrations, and queries for ro"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ro-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The migration tests drive the real `ro_sync` API against a database the
# previous binary created, because a stale column read is a runtime
# failure and only the runtime path can see it. ro-sync already depends on
# ro-state, so this is dev-only and adds no cycle.
ro-sync = { path = "../ro-sync" }
