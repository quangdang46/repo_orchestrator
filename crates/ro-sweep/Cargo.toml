[package]
name = "ro-sweep"
description = "The safety net: denylist, secret scan and quality gates, checked before ro writes"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# For the single redaction rule, shared with the identity guard: two
# implementations of "what does a secret look like in a log" is one too
# many, and the two would drift.
ro-core.workspace = true

anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
globset.workspace = true
regex.workspace = true

# Dropped in the Phase 4 cut, all now unreferenced: ro-config, ro-sync,
# ro-state, ro-git, rusqlite, serde_json. ro-config went with
# `commit.rs`, which was the only reader of `[checkpoint]`; the preflight
# itself now lives in ro-engine, which reads the config at the CLI edge.

[dev-dependencies]
# `serde_json` is here because a test round-trips a GateResult through JSON
# to prove it serialises; that is a test claim, not a runtime one, so it
# does not belong in the published dependency set.
tempfile.workspace = true
serde_json.workspace = true
