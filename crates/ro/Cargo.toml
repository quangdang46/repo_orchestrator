[package]
name = "ro"
description = "GitHub-first repo orchestration CLI"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "ro"
path = "src/main.rs"

[dependencies]
ro-core.workspace = true
ro-config.workspace = true
ro-state.workspace = true
ro-git.workspace = true
ro-github.workspace = true
ro-jobs.workspace = true
ro-sync.workspace = true
ro-sweep.workspace = true
# The Engine trait and the three built-ins. Part of the same commit as the
# workspace registration, per the bead.
ro-engine.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
serde.workspace = true
# NdjsonWriter stamps an RFC3339 timestamp on every event via `time`.
time.workspace = true
toml.workspace = true
globset.workspace = true
# For `doctor --fix`, which adds missing sections to an existing config in
# place rather than re-encoding it — the same reason ro-config needs it.
toml_edit.workspace = true
# tempfile is a runtime dependency, not a test-only one: doctor.rs calls
# tempfile::tempdir() in production, inside the ConfigPaths::discover() fallback.
tempfile.workspace = true

[dev-dependencies]
# The docs are checked against the live clap tree, so the test reads
# `ro schema` and needs the JSON it emits.
serde_json.workspace = true
ro-testkit = { path = "../ro-testkit" }
# The `runs` audit row is the only place a fleet run's width and deadline are
# recorded, so a test that claims `core.parallel` is honoured has to read it
# rather than take the exit code's word for it.
rusqlite.workspace = true

[features]
# Re-export of `ro-core`'s `keychain`, so the default build reads a
# keychain entry exactly as it always has.
#
# The forwarding is the point. `ro-core` is depended on with
# `default-features = false` (see the workspace table), because a
# `--no-default-features` build otherwise re-enables the feature through
# this very edge — and the release build for musl then reaches
# `libdbus-sys`, which a statically linked musl binary cannot link.
# Stating the feature here instead means the two build modes are
# genuinely different, and a build that asks for no defaults gets none.
default = ["keychain"]
keychain = ["ro-core/keychain"]
