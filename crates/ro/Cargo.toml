[package]
name = "ro"
description = "GitHub-first repo orchestration CLI"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "ro"
path = "src/main.rs"

[dependencies]
ro-core.workspace = true
ro-config.workspace = true
ro-state.workspace = true
ro-git.workspace = true
ro-github.workspace = true
ro-jobs.workspace = true
ro-sync.workspace = true
ro-sweep.workspace = true
# The Engine trait and the three built-ins. Part of the same commit as the
# workspace registration, per the bead.
ro-engine.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
# NdjsonWriter stamps an RFC3339 timestamp on every event via `time`.
time.workspace = true
toml.workspace = true
globset.workspace = true
# For `doctor --fix`, which adds missing sections to an existing config in
# place rather than re-encoding it — the same reason ro-config needs it.
toml_edit.workspace = true
# tempfile is a runtime dependency, not a test-only one: doctor.rs calls
# tempfile::tempdir() in production, inside the ConfigPaths::discover() fallback.
tempfile.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
