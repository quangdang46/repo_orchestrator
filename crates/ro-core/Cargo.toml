[package]
name = "ro-core"
description = "Core types, errors, repo specs, credential references, and redaction"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
time.workspace = true
regex.workspace = true
dirs.workspace = true
keyring = { workspace = true, optional = true }

[dev-dependencies]
# Only so the credential tests can deserialize from a TOML table, which is
# the shape a config file actually has.
toml.workspace = true

[features]
# Default-on, so a normal build can read a keychain entry.
#
# Turning it off must still leave a working tool: the resolver answers with a
# named error pointing at `env:VAR_NAME`, which is also the right answer on a
# headless CI runner. A hard keychain requirement would make ro unusable in
# exactly the automation it is meant to help, so the feature is additive and
# `env:` is always available.
default = ["keychain"]
keychain = ["dep:keyring"]
